# ============================================================
# ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config

data:
  APP_NAME: "My Kubernetes App"
  APP_ENV: "development"
  APP_MESSAGE: "Hello from ConfigMap"
  APP_PORT: "8080"

---
# ============================================================
# Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret

type: Opaque

stringData:
  DB_USERNAME: "myuser"
  DB_PASSWORD: "mypassword"

---
# ============================================================
# Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-secret-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: config-secret-demo

  template:
    metadata:
      labels:
        app: config-secret-demo

    spec:
      containers:
        - name: nginx

          image: nginx:1.27

          ports:
            - containerPort: 80

          env:
            # -------------------------------
            # ConfigMap values
            # -------------------------------
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV

            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_MESSAGE

            # -------------------------------
            # Secret values
            # -------------------------------
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD

---
# ============================================================
# Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: config-secret-service

spec:
  type: NodePort

  selector:
    app: config-secret-demo

  ports:
    - port: 80
      targetPort: 80
