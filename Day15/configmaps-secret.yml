# ============================================================
# 1. CONFIGMAP
# Non-sensitive MySQL configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config

data:
  MYSQL_DATABASE: "mydb"
  MYSQL_USER: "myuser"


---
# ============================================================
# 2. SECRET
# Sensitive MySQL passwords
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret

type: Opaque

stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "mypassword"


---
# ============================================================
# 3. MYSQL STATEFULSET
# ============================================================
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql

spec:
  serviceName: mysql

  replicas: 3

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql

          image: mysql:8.0

          ports:
            - name: mysql
              containerPort: 3306

          # ==================================================
          # CONFIGURATION + SECRET
          # ==================================================
          env:

            # From ConfigMap
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: mysql-config
                  key: MYSQL_USER

            # From Secret
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

          # ==================================================
          # STORAGE
          # ==================================================
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

          # ==================================================
          # READINESS PROBE
          # ==================================================
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"

            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

          # ==================================================
          # LIVENESS PROBE
          # ==================================================
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

  # ==========================================================
  # PVC TEMPLATE
  # Kubernetes automatically creates 3 PVCs
  # ==========================================================
  volumeClaimTemplates:

    - metadata:
        name: mysql-data

      spec:
        storageClassName: mysql-ebs

        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
